# Migrates and seeds the production database — run it by hand (Actions → seed → Run workflow).
# No schedule: since the movies re-plan (B1) the seeded cinemas have open-ended schedules whose
# shows materialise 14 days ahead on read, so the catalogue never empties without a cron. The seed
# is idempotent and never deletes shows, so re-running it is safe.
# Runs on GitHub's runner (free for a public repo) — no Vercel compute. Needs repo secret DATABASE_URL
# (the same Neon URL as the frontrow-api project; app.db.asyncpg_url converts it).
name: seed
on:
  workflow_dispatch:

concurrency: { group: seed-production, cancel-in-progress: false }
permissions: { contents: read }

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STAFF_EMAILS: ${{ vars.STAFF_EMAILS }} # real staff accounts for the hidden /staff door
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6 # python version from api/.python-version
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run python -m app.seed
