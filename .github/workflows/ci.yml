name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # web/ — typecheck + build. That is all (lean rules).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json # pnpm version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  # api/ — ruff + pyright + pytest against a throwaway Postgres (Redis joins in F2).
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: frontrow
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway container, no password
          POSTGRES_DB: frontrow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U frontrow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://frontrow@localhost:5432/frontrow_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6 # python version from api/.python-version
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked --directory api
      - run: uv run --directory api ruff check .
      - run: uv run --directory api ruff format --check .
      - run: uv run --directory api pyright
      - run: uv run --directory api pytest
